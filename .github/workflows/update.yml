name: Update README contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-contributions
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README contribution table
        env:
          GITHUB_USERNAME: dss-time
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          README_TIMEZONE: UTC
          START_YEAR: "2021"
          SIGNAL_WIDTH: "18"
        run: python scripts/update_contributions.py

      - name: Commit and push README update
        run: |
          if git diff --quiet README.md; then
            echo "README.md has no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Update yearly activity"
          git push
